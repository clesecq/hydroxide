name: release

on:
  push:
    tags: ["v*"]
  # Release an existing tag, e.g. one pushed before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # git describe needs the tags and the history leading to them.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          version=$(git describe --tags --always)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            IFS=/ read -r goos goarch goarm <<< "$target"
            name="hydroxide_${TAG}_${goos}_${goarch}${goarm:+v$goarm}"
            echo "==> $name"

            ext=""
            [ "$goos" = windows ] && ext=".exe"

            mkdir -p "build/$name"
            GOOS=$goos GOARCH=$goarch GOARM=$goarm go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "build/$name/hydroxide$ext" ./cmd/hydroxide
            cp README.md LICENSE "build/$name/"

            if [ "$goos" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "hydroxide $TAG"
          fi
