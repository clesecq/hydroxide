name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags and the history leading to them.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Set version
        run: echo "VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      - name: Build
        run: go build -v -ldflags "-X main.version=$VERSION" ./...

      - name: Test
        run: go test -race ./...

      # captcha/browser.go picks a different launcher per runtime.GOOS, so make
      # sure the other platforms still compile.
      - name: Cross-compile
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -ldflags "-X main.version=$VERSION" ./...
          done
