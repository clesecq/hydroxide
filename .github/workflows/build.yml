name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race ./...

      # captcha/browser.go picks a different launcher per runtime.GOOS, so make
      # sure the other platforms still compile.
      - name: Cross-compile
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
